name: expense_tracker
description: A fast, offline expense tracker with budgets, charts, recurring entries and backups.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  fl_chart: ^1.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.4
  file_picker: ^13.4.1
  shadcn_flutter: 0.0.55
  shadcn_flutter_material: 0.0.54
  hugeicons: 4.4.0

  material_ui: any
dev_dependencies:
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
