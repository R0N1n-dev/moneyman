name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.devn1n --project-name expense_tracker .
            rm -rf test
            sed -i 's|android:label="[^"]*"|android:label="Expense Tracker"|' android/app/src/main/AndroidManifest.xml
          fi

      - name: Use stable signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using keystore from secret DEBUG_KEYSTORE_BASE64"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set. Each build gets a random signing key."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "expense-tracker-${{ steps.ver.outputs.tag }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker-${{ steps.ver.outputs.tag }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Expense Tracker ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: expense-tracker-${{ steps.ver.outputs.tag }}.apk
